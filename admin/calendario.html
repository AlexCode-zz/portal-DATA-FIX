<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Calendario — Panel de Administración DATA FIX">
<title>Calendario — Panel Admin DATA FIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<nav class="navbar">
    <div class="contenedor">
        <a href="dashboard.html" class="navbar-marca">DATA<span class="marca-dot">FIX</span> <span style="font-weight:500; color:rgba(255,255,255,.45); font-size:0.8rem; letter-spacing:.04em">/ ADMIN</span></a>
        <ul class="nav-menu" style="display:flex; align-items:center; gap:12px;">
            <li>
                <button class="btn-theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </li>
            <li style="display:flex; align-items:center; gap:8px;">
                <span class="avatar-inicial" id="iniciales-admin-actual">--</span>
                <span style="font-size:.88rem; color:rgba(255,255,255,.8);" id="nombre-admin-actual">Cargando...</span>
            </li>
            <li><a href="#" id="link-logout-admin" style="color:rgba(255,255,255,.65);">Cerrar sesión</a></li>
        </ul>
    </div>
</nav>

<div class="layout-admin">
    <aside class="sidebar">
        <span class="grupo-titulo">Gestión</span>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="clientes.html"><i class="bi bi-people"></i> Clientes</a>
        <a href="dispositivos.html"><i class="bi bi-laptop"></i> Dispositivos</a>
        <a href="servicios.html"><i class="bi bi-tools"></i> Servicios</a>
        <a href="reparaciones.html"><i class="bi bi-wrench"></i> Reparaciones</a>
        <a href="citas.html"><i class="bi bi-calendar-event"></i> Citas</a>
        <a href="reportes.html"><i class="bi bi-bar-chart-line"></i> Reportes</a>
        <a href="calendario.html" class="activo"><i class="bi bi-calendar3"></i> Calendario</a>
    </aside>

    <main class="contenido-admin">

        <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
            <div>
                <h1>Calendario</h1>
                <p class="descripcion-pagina">Ingresos, entregas y reparaciones organizados por fecha.</p>
            </div>
        </div>

        <!-- Selector de vista: Dispositivos / Reparaciones -->
        <div class="barra-superior-admin">
            <div class="tabs" style="border:none; margin-bottom:0;">
                <button class="tab-btn activo" data-modo-calendario="dispositivos"><i class="bi bi-laptop me-1"></i> Dispositivos</button>
                <button class="tab-btn" data-modo-calendario="reparaciones"><i class="bi bi-wrench me-1"></i> Reparaciones</button>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <div class="buscador-admin" style="margin:0;">
                    <i class="bi bi-search"></i>
                    <input type="text" id="buscador-ticket-calendario" placeholder="Buscar por ticket (ej. TF-2026-1228)...">
                </div>
                <div class="campo" style="margin:0; min-width:260px; max-width:320px; width:100%;">
                    <select id="select-filtro-calendario"></select>
                </div>
            </div>
        </div>

        <p id="info-busqueda-calendario" style="display:none; margin:10px 0 0; font-size:.85rem; color:var(--texto-sec);"></p>

        <!-- Calendario -->
        <div class="caja" style="margin-top:16px;">

            <div class="calendario-nav">
                <div class="calendario-nav-controles">
                    <button type="button" class="btn-nav-calendario" id="btn-mes-anterior" title="Mes anterior"><i class="bi bi-chevron-left"></i></button>
                    <span class="calendario-etiqueta-mes" id="etiqueta-mes-calendario">—</span>
                    <button type="button" class="btn-nav-calendario" id="btn-mes-siguiente" title="Mes siguiente"><i class="bi bi-chevron-right"></i></button>
                    <button type="button" class="btn btn-contorno btn-sm" id="btn-hoy-calendario">Hoy</button>
                </div>

                <div class="leyenda-calendario" id="leyenda-dispositivos">
                    <span><span class="punto-leyenda" style="background:var(--azul);"></span>Ingreso</span>
                    <span><span class="punto-leyenda" style="background:var(--verde);"></span>Entrega</span>
                </div>
                <div class="leyenda-calendario" id="leyenda-reparaciones" style="display:none;">
                    <span><span class="punto-leyenda" style="background:#9333EA;"></span>Reparación asignada</span>
                </div>
            </div>

            <div id="calendario-grid">
                <p class="cargando">Cargando calendario...</p>
            </div>

        </div>

    </main>
</div>

<!-- Modal: detalle del día -->
<div class="modal-overlay" id="modal-dia-calendario">
    <div class="modal-contenido modal-contenido-calendario">
        <div class="modal-header-calendario">
            <h2 id="modal-dia-titulo">Detalle del día</h2>
            <button type="button" class="modal-cerrar-btn" id="btn-cerrar-modal-dia"><i class="bi bi-x-lg"></i></button>
        </div>
        <div id="modal-dia-cuerpo">
            <!-- Dinámico -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/calendario.js"></script>
</body>
</html>
